name: Deploy to ECS Fargate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

      WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE_NAME }}
      WEB_CONTAINER: ${{ vars.ECS_WEB_CONTAINER_NAME }}

      WEBHOOK_SERVICE: ${{ vars.ECS_WEBHOOK_WORKER_SERVICE_NAME }}
      WEBHOOK_CONTAINER: ${{ vars.ECS_WEBHOOK_WORKER_CONTAINER_NAME }}

      EMAIL_SERVICE: ${{ vars.ECS_EMAIL_WORKER_SERVICE_NAME }}
      EMAIL_CONTAINER: ${{ vars.ECS_EMAIL_WORKER_CONTAINER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI_LATEST=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}
            ${{ env.IMAGE_URI_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy web and worker services
        run: |
          set -euo pipefail

          deploy_service() {
            local service_name="$1"
            local container_name="$2"
            local taskdef_path="/tmp/${service_name}-taskdef.json"

            echo "Deploying ${service_name}..."

            local current_taskdef_arn
            current_taskdef_arn="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name" \
              --query 'services[0].taskDefinition' \
              --output text)"

            aws ecs describe-task-definition \
              --task-definition "$current_taskdef_arn" \
              --query 'taskDefinition' \
              --output json \
              | jq '
                  del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy,
                    .deregisteredAt
                  )
                ' \
              | jq --arg IMAGE "$IMAGE_URI" --arg CONTAINER "$container_name" '
                  .containerDefinitions |= map(
                    if .name == $CONTAINER then .image = $IMAGE else . end
                  )
                ' > "$taskdef_path"

            local new_taskdef_arn
            new_taskdef_arn="$(aws ecs register-task-definition \
              --cli-input-json "file://$taskdef_path" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)"

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service_name" \
              --task-definition "$new_taskdef_arn" \
              --force-new-deployment

            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$service_name"

            echo "Deployed ${service_name}"
          }

          deploy_service "$WEB_SERVICE" "$WEB_CONTAINER"
          deploy_service "$WEBHOOK_SERVICE" "$WEBHOOK_CONTAINER"
          deploy_service "$EMAIL_SERVICE" "$EMAIL_CONTAINER"
