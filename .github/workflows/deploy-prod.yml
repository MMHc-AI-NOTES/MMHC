name: Deploy to Prod ECR

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{secrets.AWS_REGION}}
      ECR_REPOSITORY: mmh/mmh-backend
      ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI_LATEST=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_URI }}
            ${{ env.IMAGE_URI_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
