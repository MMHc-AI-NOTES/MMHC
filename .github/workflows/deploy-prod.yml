name: Deploy to Prod ECR & ECS

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    timeout-minutes: 30
    name: Build and deploy to ECS
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{secrets.AWS_REGION}}
      ECR_REPOSITORY: mmh/mmh-backend
      ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}
      ECS_CLUSTER: ${{vars.ECS_CLUSTER}}
      ECS_SERVICE: ${{vars.ECS_SERVICE}}
      ECS_SESSION_CPT_SERVICE: mmh-session-cpt-worker-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_GITHUB }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_URI_LATEST=${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.image_uri  }}
            ${{ steps.image.outputs.image_uri_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/task-definition.json
          container-name: Main
          image: ${{ steps.image.outputs.image_uri }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      # Workers use the same image as the web application. Each gets its own
      # ECS task definition and service, with only the command changed.
      - name: Create worker task definitions
        run: |
          jq '
            .family = "mmh-session-cpt-worker" |
            .containerDefinitions[0].name = "SessionCptWorker" |
            .containerDefinitions[0].command = ["node", "build/ace.js", "session:cpt-worker"] |
            .containerDefinitions[0].environment = ((.containerDefinitions[0].environment // []) + [{"name":"RUN_MIGRATIONS","value":"false"}]) |
            .containerDefinitions[0].restartPolicy = {"enabled":true,"ignoredExitCodes":[0],"restartAttemptPeriodSeconds":60} |
            del(.containerDefinitions[0].portMappings)
          ' aws/task-definition.json > /tmp/session-cpt-worker-task-definition.json

      - name: Render session CPT worker task definition
        id: render-session-cpt-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/session-cpt-worker-task-definition.json
          container-name: SessionCptWorker
          image: ${{ steps.image.outputs.image_uri }}

      - name: Deploy session CPT worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-session-cpt-worker.outputs.task-definition }}
          service: ${{ env.ECS_SESSION_CPT_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
